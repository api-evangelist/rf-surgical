description: 'Rf Surgical (RF Surgical Systems) was a medical-device company in the surgical patient-safety
  space, known for radio-frequency detection technology used to locate retained surgical items such as
  sponges and gauze during and after operations. It was surfaced as a portfolio company of menlo-ventures
  and added to the API Evangelist network as a stub. Enrichment probing (2026-07-21) found no independent
  developer surface: the rfsurgical.com domain no longer resolves to a company site and is parked for sale
  (HugeDomains), consistent with the company having been absorbed into a larger medical-device parent. There
  is no public API, developer portal, OpenAPI/AsyncAPI specification, SDK, package, MCP server, or
  documentation to harvest, so no supply-side API artifacts were generated. This profile carries identity
  metadata only.'
